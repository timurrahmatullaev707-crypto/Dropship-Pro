<!DOCTYPE html>
<html lang="uz" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valmora | Tizim Sozlamalari</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard">
        <aside class="sidebar">
            <div class="logo" onclick="window.location.href='index.html'">
                <div class="logo-icon"><i class="fa-solid fa-gem"></i></div>
                <span>VALMORA</span>
            </div>
            <div class="sidebar-title">NAVIGATSIYA</div>
            <nav class="sidebar-menu">
                <a href="index.html"><i class="fa-solid fa-chart-pie"></i><span>Boshqaruv paneli</span></a>
                <a href="products.html"><i class="fa-solid fa-box-archive"></i><span>Mahsulotlar</span></a>
                <a href="orders.html"><i class="fa-solid fa-bag-shopping"></i><span>Buyurtmalar</span></a>
                <a href="customers.html"><i class="fa-solid fa-users"></i><span>Mijozlar</span></a>
                <div class="sidebar-title">TAHLIL</div>
                <a href="analytics.html"><i class="fa-solid fa-chart-line"></i><span>Statistika</span></a>
                <a href="finance.html"><i class="fa-solid fa-wallet"></i><span>Moliya</span></a>
                <div class="sidebar-title">TIZIM</div>
                <a href="settings.html" class="active"><i class="fa-solid fa-gear"></i><span>Sozlamalar</span></a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <div>
                    <h1>Do'kon & Tizim Sozlamalari</h1>
                    <p>Valmora brendi sozlamalari, Telegram integratsiyasi va to'lov shlyuzlari.</p>
                </div>
                <div class="header-actions">
                    <button class="icon-button" id="themeToggle"><i class="fa-solid fa-sun"></i></button>
                    <button class="icon-button cart-toggle-btn"><i class="fa-solid fa-bag-shopping"></i><span class="cart-counter">0</span></button>
                    <div class="profile"><div class="profile-avatar">V</div><div class="profile-info"><strong>Valmora</strong><span>Admin</span></div></div>
                </div>
            </header>

            <div class="products-page-container">
                <div class="panel" style="max-width: 760px;">
                    <div class="panel-header">
                        <h3>Brend & Do'kon Parametrlari</h3>
                    </div>

                    <form onsubmit="event.preventDefault(); sound.playSuccess(); showToast('Sozlamalar saqlandi', 'success');">
                        <div class="form-grid-2">
                            <div class="form-group">
                                <label>Brend Nomi</label>
                                <input type="text" value="Valmora">
                            </div>
                            <div class="form-group">
                                <label>Asosiy Valyuta</label>
                                <select>
                                    <option value="UZS">UZS (O'zbek so'mi)</option>
                                    <option value="USD">USD (AQSh dollari)</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Telegram Bot Token (Buyurtmalarni Telegramda olish)</label>
                            <input type="text" value="7128392812:AAHq_ValmoraBotToken">
                        </div>

                        <div class="form-group">
                            <label>Telegram Administrator Chat ID</label>
                            <input type="text" value="984128491">
                        </div>

                        <div class="form-grid-2">
                            <div class="form-group">
                                <label>Click Merchant ID</label>
                                <input type="text" value="14209">
                            </div>
                            <div class="form-group">
                                <label>Payme Merchant ID</label>
                                <input type="text" value="valmora_pay_64f1">
                            </div>
                        </div>

                        <div style="display: flex; justify-content: flex-end; margin-top: 18px;">
                            <button type="submit" class="btn-gradient">
                                Saqlash
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
